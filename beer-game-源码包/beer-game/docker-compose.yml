# 本地一键起：docker compose up -d --build
# 需要先 cp .env.example .env（或使用下方默认值）
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: beergame-db
    environment:
      POSTGRES_USER: beer
      POSTGRES_PASSWORD: beer
      POSTGRES_DB: beergame
    ports:
      - '5432:5432'
    volumes:
      - beergame_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beer -d beergame']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: beergame-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://beer:beer@db:5432/beergame?schema=public
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '4000:4000'
    command: >
      sh -c "npx prisma migrate deploy --schema prisma/schema.prisma && node dist/index.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    container_name: beergame-web
    # 前端已内置极简静态服务器（SPA fallback），容器内端口 80
    depends_on:
      - server
    ports:
      - '5173:80'

volumes:
  beergame_data: